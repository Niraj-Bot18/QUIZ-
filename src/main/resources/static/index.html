<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quiz Generation App</title>
    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { background: #f4f6f9; padding: 30px; display: flex; justify-content: center; }
        .card { background: #fff; width: 100%; max-width: 650px; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .btn { background: #2563eb; color: #fff; border: none; padding: 10px 18px; border-radius: 5px; cursor: pointer; font-size: 15px; }
        .btn:hover { background: #1d4ed8; }
        .btn-green { background: #16a34a; }
        .btn-green:hover { background: #15803d; }
        .form-row { display: flex; gap: 10px; margin-bottom: 15px; }
        select, input { padding: 8px 12px; border: 1px solid #ccc; border-radius: 5px; width: 100%; font-size: 14px; }
        .question-box { margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #eee; }
        .question-title { font-weight: bold; margin-bottom: 10px; color: #222; }
        .option { display: block; margin: 6px 0; cursor: pointer; }
        .result-box { text-align: center; font-size: 20px; font-weight: bold; color: #16a34a; padding: 20px; }
        .nav-links { display: flex; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .nav-links a { color: #2563eb; text-decoration: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="card">
    <h1>Online Quiz System</h1>

    <!-- Simple Navigation -->
    <div class="nav-links">
        <a onclick="showView('quiz')">Take Quiz</a>
        <a onclick="showView('add')">Add Question</a>
    </div>

    <!-- 1. Take Quiz View -->
    <div id="quiz-view">
        <div class="form-row">
            <select id="quiz-category">
                <option value="ALL">All Topics</option>
                <option value="Java">Java</option>
            </select>
            <button class="btn" onclick="loadQuiz()">Generate Quiz</button>
        </div>

        <div id="quiz-container"></div>
        <button id="submit-btn" class="btn btn-green" style="display:none; width: 100%; margin-top: 15px;" onclick="submitAnswers()">Submit Quiz</button>
        <div id="result" class="result-box" style="display:none;"></div>
    </div>

    <!-- 2. Add Question View -->
    <div id="add-view" style="display:none;">
        <h2>Add New Question</h2>
        <div class="form-row"><input type="text" id="q-title" placeholder="Question Title"></div>
        <div class="form-row"><input type="text" id="q-opt1" placeholder="Option 1"></div>
        <div class="form-row"><input type="text" id="q-opt2" placeholder="Option 2"></div>
        <div class="form-row"><input type="text" id="q-opt3" placeholder="Option 3"></div>
        <div class="form-row"><input type="text" id="q-opt4" placeholder="Option 4"></div>
        <div class="form-row"><input type="text" id="q-ans" placeholder="Correct Option Answer (e.g. Option 1 text)"></div>
        <div class="form-row"><input type="text" id="q-cat" placeholder="Category (e.g. Java)" value="Java"></div>
        <button class="btn btn-green" style="width: 100%;" onclick="saveQuestion()">Save Question</button>
    </div>
</div>

<script>
    let questions = [];

    function showView(view) {
        document.getElementById('quiz-view').style.display = view === 'quiz' ? 'block' : 'none';
        document.getElementById('add-view').style.display = view === 'add' ? 'block' : 'none';
    }

    // 1. Fetch & Generate Quiz
    async function loadQuiz() {
        const cat = document.getElementById('quiz-category').value;
        const res = await fetch(`/api/quiz/generate?category=${cat}&count=5`);
        questions = await res.json();

        const container = document.getElementById('quiz-container');
        container.innerHTML = '';
        document.getElementById('result').style.display = 'none';

        if (questions.length === 0) {
            container.innerHTML = '<p>No questions found in this category.</p>';
            return;
        }

        questions.forEach((q, i) => {
            container.innerHTML += `
                <div class="question-box">
                    <div class="question-title">${i + 1}. ${q.questionTitle}</div>
                    <label class="option"><input type="radio" name="q_${q.id}" value="${q.option1}"> ${q.option1}</label>
                    <label class="option"><input type="radio" name="q_${q.id}" value="${q.option2}"> ${q.option2}</label>
                    <label class="option"><input type="radio" name="q_${q.id}" value="${q.option3}"> ${q.option3}</label>
                    <label class="option"><input type="radio" name="q_${q.id}" value="${q.option4}"> ${q.option4}</label>
                </div>`;
        });

        document.getElementById('submit-btn').style.display = 'block';
    }

    // 2. Submit Answers & Get Score
    async function submitAnswers() {
        const answers = {};
        questions.forEach(q => {
            const selected = document.querySelector(`input[name="q_${q.id}"]:checked`);
            if (selected) answers[q.id] = selected.value;
        });

        const res = await fetch('/api/quiz/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(answers)
        });

        const score = await res.json();
        const resultDiv = document.getElementById('result');
        resultDiv.innerHTML = `Your Score: ${score} / ${questions.length}`;
        resultDiv.style.display = 'block';
    }

    // 3. Save Question
    async function saveQuestion() {
        const newQ = {
            questionTitle: document.getElementById('q-title').value,
            option1: document.getElementById('q-opt1').value,
            option2: document.getElementById('q-opt2').value,
            option3: document.getElementById('q-opt3').value,
            option4: document.getElementById('q-opt4').value,
            rightAnswer: document.getElementById('q-ans').value,
            category: document.getElementById('q-cat').value
        };

        await fetch('/api/questions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newQ)
        });

        alert('Question added successfully!');
        showView('quiz');
    }
</script>
</body>
</html>
